name: forecast-bust
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.10
  - numpy
  - pandas
  - xarray
  - dask
  - netcdf4
  - zarr
  - cfgrib
  - eccodes
  - h5netcdf
  - scipy
  - scikit-learn
  - matplotlib
  - cartopy
  - geopandas
  - shapely
  - pyproj
  - metpy
  - pytorch::pytorch
  - pytorch::torchvision
  - pytorch::cpuonly
  - pip
  - pip:
    - cdsapi
    - imdlib
    - s3fs
    - boto3
    - xesmf
    - captum
    - shap
    - fastapi
    - uvicorn[standard]
    - streamlit
    - folium
    - streamlit-folium
    - plotly
    - open-meteo-api
    - openmeteo-requests
    - requests-cache
    - retry-requests
    - pydantic
    - python-dotenv
    - jupyter
    - ipykernel
    - tqdm
    - wandb
    - pytest
